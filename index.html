<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estúdio do Robô</title>
  <meta name="description" content="Jogo de Educomunicação para o 1º, 2º e 3º ano: imagens, rádio, fotonovela e jornal.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <!-- O "?v=" obriga o navegador a baixar a versão nova. Ao mudar um arquivo, aumente o número. -->
  <link rel="stylesheet" href="css/estilo.css?v=2">
</head>
<body>
  <p id="aviso-f1" class="so-leitor">Para jogar com som, aperte F1.</p>
  <div id="app">
    <header id="topo" class="topo">
      <button id="botao-voltar" class="botao botao-topo" type="button" hidden>
        <svg viewBox="0 0 48 48" class="picto" aria-hidden="true"><path d="M20,10 L6,24 L20,38 M6,24 L42,24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Voltar
      </button>
      <p id="topo-titulo" class="topo-titulo">Estúdio do Robô</p>
      <button id="botao-ajuda" class="botao botao-topo" type="button">
        <svg viewBox="0 0 48 48" class="picto" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M17,18 Q17,10 24,10 Q31,10 31,17 Q31,22 25,24 L24,29" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="36" r="2.8" fill="currentColor"/></svg>
        Como jogar
      </button>
      <button id="botao-pausa" class="botao botao-topo botao-pausa" type="button">
        <svg viewBox="0 0 48 48" class="picto" aria-hidden="true"><rect x="12" y="8" width="9" height="32" rx="2" fill="currentColor"/><rect x="27" y="8" width="9" height="32" rx="2" fill="currentColor"/></svg>
        Pausa
      </button>
    </header>
    <main id="tela" class="tela" tabindex="-1">
      <noscript><p>Este jogo precisa do JavaScript ligado no navegador.</p></noscript>
    </main>
  </div>

  <!-- Tela de pausa: tranquila, até o estudante decidir voltar. -->
  <div id="pausa" class="pausa" role="dialog" aria-modal="true" aria-labelledby="pausa-titulo" hidden>
    <div class="pausa-caixa">
      <div id="pausa-robo" class="pausa-robo"></div>
      <div class="respira" aria-hidden="true"></div>
      <h2 id="pausa-titulo" tabindex="-1">Pausa</h2>
      <p>Pode descansar. O jogo espera por você.</p>
      <button id="botao-sair-pausa" class="botao principal" type="button">Voltar ao jogo</button>
    </div>
  </div>

  <!-- Recados para leitores de tela (NVDA, Narrador). Também mostra na tela o que a voz disse. -->
  <div id="anuncio" class="so-leitor" aria-live="polite" aria-atomic="true"></div>

  <script src="js/conteudo.js?v=2"></script>
  <script src="js/desenhos.js?v=2"></script>
  <script src="js/base.js?v=2"></script>
  <script src="js/atividades.js?v=2"></script>
  <script src="js/producoes.js?v=2"></script>
  <script src="js/telas.js?v=2"></script>
</body>
</html>
